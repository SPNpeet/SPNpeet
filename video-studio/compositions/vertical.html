<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"clipSrc","type":"string","label":"Clip path","default":"assets/clip.mp4"},
    {"id":"clipStart","type":"number","label":"Clip in-point (seconds)","default":0},
    {"id":"clipDuration","type":"number","label":"Clip duration on timeline","default":17},
    {"id":"hookText","type":"string","label":"Hook (first 2s)","default":"Wait for it..."},
    {"id":"hookSub","type":"string","label":"Hook subtext","default":"this is insane 🔥"},
    {"id":"midCaption","type":"string","label":"Mid-clip caption","default":"Behind the scenes"},
    {"id":"ctaText","type":"string","label":"CTA headline","default":"FOLLOW @SPNpeet"},
    {"id":"ctaSub","type":"string","label":"CTA subline","default":"new drops every week"},
    {"id":"accent","type":"color","label":"Accent color","default":"#f72585"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Inter", system-ui, sans-serif; color: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; }

      /* ── Video ── */
      #main-clip {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        filter: contrast(1.1) saturate(1.15) brightness(0.92);
      }

      /* Cinematic overlays */
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 100% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
      }
      #grain {
        position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: 0.15;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
      }
      /* letterbox bars for cinematic look */
      #bar-top, #bar-bottom {
        position: absolute; left: 0; right: 0; height: 100px; background: #000; pointer-events: none;
      }
      #bar-top { top: 0; }
      #bar-bottom { bottom: 0; }

      /* ── Hook card (0-3s) ── */
      #hook-card {
        position: absolute; inset: 0;
        background: #000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 80px 60px;
      }
      #hook-text {
        font-size: 112px; font-weight: 900; line-height: 1.1; letter-spacing: -2px;
        text-shadow: 0 4px 40px rgba(0,0,0,0.5);
      }
      #hook-rule { width: 160px; height: 5px; border-radius: 3px; margin: 32px auto 24px; }
      #hook-sub {
        font-size: 50px; font-weight: 400; opacity: 0.8; letter-spacing: 1px;
        text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      }

      /* ── Mid caption (bold pill style) ── */
      #mid-caption {
        position: absolute; left: 80px;
        top: 420px; /* safe zone below top bar */
        white-space: nowrap;
        background: rgba(0,0,0,0.72);
        backdrop-filter: blur(14px);
        border-left: 5px solid var(--acc, #f72585);
        padding: 22px 38px;
        border-radius: 0 16px 16px 0;
        font-size: 48px; font-weight: 700; letter-spacing: 0.3px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        box-shadow: 0 12px 50px rgba(0,0,0,0.45);
      }

      /* ── CTA card (outro) ── */
      #cta-card {
        position: absolute; inset: 0;
        background: #000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 80px 60px; gap: 0;
      }
      #cta-badge {
        font-size: 22px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
        opacity: 0.5; margin-bottom: 28px;
      }
      #cta-headline {
        font-size: 98px; font-weight: 900; line-height: 1.1; letter-spacing: -1.5px;
      }
      #cta-rule { width: 160px; height: 5px; border-radius: 3px; margin: 30px auto 24px; }
      #cta-sub { font-size: 46px; font-weight: 400; opacity: 0.75; letter-spacing: 1px; }

      /* ── Transitions ── */
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #flash2 { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #fadeout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vertical"
      data-start="0"
      data-duration="26"
      data-width="1080"
      data-height="1920"
    >
      <!-- Hook card (0-3s) -->
      <div id="hook-card" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="hook-text">Wait for it...</div>
        <div id="hook-rule"></div>
        <div id="hook-sub">this is insane 🔥</div>
      </div>

      <!-- Flash cut into clip -->
      <div id="flash" class="clip" data-start="2.8" data-duration="0.4" data-track-index="6"></div>

      <!-- Main clip (3-20s) -->
      <video
        id="main-clip"
        class="clip"
        src="assets/clip.mp4"
        data-start="3"
        data-duration="17"
        data-track-index="2"
        data-media-start="0"
        data-volume="0"
        muted
        playsinline
      ></video>
      <div id="vignette" class="clip" data-start="3" data-duration="17" data-track-index="8"></div>
      <div id="grain" class="clip" data-start="3" data-duration="17" data-track-index="9"></div>
      <div id="bar-top" class="clip" data-start="3" data-duration="17" data-track-index="10"></div>
      <div id="bar-bottom" class="clip" data-start="3" data-duration="17" data-track-index="11"></div>

      <!-- Mid caption (6-13s) -->
      <div id="mid-caption" class="clip" data-start="6" data-duration="7" data-track-index="5">Behind the scenes</div>

      <!-- Flash cut into outro -->
      <div id="flash2" class="clip" data-start="19.7" data-duration="0.4" data-track-index="6"></div>

      <!-- CTA outro (20-25s) -->
      <div id="cta-card" class="clip" data-start="20" data-duration="5" data-track-index="1">
        <div id="cta-badge">more coming</div>
        <div id="cta-headline">FOLLOW @SPNpeet</div>
        <div id="cta-rule"></div>
        <div id="cta-sub">new drops every week</div>
      </div>

      <!-- Fade to black (25-26s) -->
      <div id="fadeout" class="clip" data-start="25" data-duration="1" data-track-index="7"></div>
    </div>

    <script>
      (function () {
        const v = window.__hyperframes.getVariables();
        const acc = v.accent || "#f72585";

        // Apply accent color via CSS var for border-left trick
        document.getElementById("root").style.setProperty("--acc", acc);

        // Patch video src + timing
        const video = document.getElementById("main-clip");
        video.setAttribute("src", v.clipSrc);
        video.setAttribute("data-media-start", String(v.clipStart));
        video.setAttribute("data-duration", String(v.clipDuration));

        // Hook
        document.getElementById("hook-text").textContent = v.hookText;
        document.getElementById("hook-rule").style.background = acc;
        document.getElementById("hook-sub").textContent = v.hookSub;

        // Mid caption
        document.getElementById("mid-caption").textContent = v.midCaption;
        document.getElementById("mid-caption").style.borderLeftColor = acc;

        // CTA
        document.getElementById("cta-headline").textContent = v.ctaText;
        document.getElementById("cta-rule").style.background = acc;
        document.getElementById("cta-sub").textContent = v.ctaSub;

        /* ── Timeline ── */
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Hook card entrance
        tl.from("#hook-text", { y: 80, opacity: 0, duration: 0.55, ease: "power3.out" }, 0);
        tl.from("#hook-rule", { scaleX: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.out" }, 0.35);
        tl.from("#hook-sub", { y: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.5);
        // Hook exit shake
        tl.to("#hook-card", { x: 12, duration: 0.06, ease: "power2.in" }, 2.5);
        tl.to("#hook-card", { x: 0, opacity: 0, duration: 0.12, ease: "power1.out" }, 2.56);
        tl.set("#hook-card", { opacity: 0 }, 3);

        // Flash 1
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 2.8);
        tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 2.9);
        tl.set("#flash", { opacity: 0 }, 3.2);

        // Clip fade in
        tl.from("#main-clip", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3);
        tl.from("#vignette", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3);
        tl.from("#grain", { opacity: 0, duration: 0.4, ease: "power2.out" }, 3);
        tl.from("#bar-top", { scaleY: 0, transformOrigin: "top center", duration: 0.45, ease: "power2.out" }, 3);
        tl.from("#bar-bottom", { scaleY: 0, transformOrigin: "bottom center", duration: 0.45, ease: "power2.out" }, 3);

        // Mid caption slide in from left (uses x tween, no CSS transform conflict)
        tl.fromTo("#mid-caption", { x: -600, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 6);
        tl.to("#mid-caption", { x: -600, opacity: 0, duration: 0.45, ease: "power3.in" }, 12.5);
        tl.set("#mid-caption", { opacity: 0 }, 13);

        // Kinetic zoom push on clip just before second flash
        tl.to("#main-clip", { scale: 1.06, y: -30, duration: 0.4, ease: "power2.in" }, 19.3);

        // Flash 2
        tl.fromTo("#flash2", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 19.7);
        tl.to("#flash2", { opacity: 0, duration: 0.3, ease: "power2.out" }, 19.8);
        tl.set("#flash2", { opacity: 0 }, 20.1);

        // CTA stagger
        tl.from("#cta-badge", { opacity: 0, y: 30, duration: 0.5, ease: "power2.out" }, 20.1);
        tl.from("#cta-headline", { opacity: 0, y: 60, scale: 0.95, duration: 0.65, ease: "power3.out" }, 20.3);
        tl.from("#cta-rule", { scaleX: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.out" }, 20.65);
        tl.from("#cta-sub", { opacity: 0, y: 30, duration: 0.5, ease: "power2.out" }, 20.75);

        // Fade to black
        tl.fromTo("#fadeout", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power1.in" }, 25);

        window.__timelines["vertical"] = tl;
      })();
    </script>
  </body>
</html>
