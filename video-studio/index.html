<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"clipSrc","type":"string","label":"Clip path","default":"assets/clip.mp4"},
    {"id":"clipStart","type":"number","label":"Clip in-point (seconds)","default":0},
    {"id":"clipDuration","type":"number","label":"Clip duration on timeline","default":21},
    {"id":"introTitle","type":"string","label":"Intro title","default":"NEW DROP"},
    {"id":"introSubtitle","type":"string","label":"Intro subtitle","default":"Coming this week"},
    {"id":"caption","type":"string","label":"Lower-third caption","default":"Behind the scenes"},
    {"id":"outroTitle","type":"string","label":"Outro headline","default":"FOLLOW @SPNpeet"},
    {"id":"outroSubtitle","type":"string","label":"Outro subline","default":"More on the way"},
    {"id":"accent","type":"color","label":"Accent color","default":"#22d3ee"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Inter", system-ui, sans-serif; color: #fff; }
      #root { position: relative; width: 1920px; height: 1080px; }

      .card-bg {
        position: absolute; inset: 0; background: #0b0b10;
      }
      .card-radial {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 60%, rgba(255,255,255,0.08), transparent 60%);
      }
      .card-stack {
        position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      }
      .card-title { font-size: 132px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
      .card-rule { width: 280px; height: 4px; border-radius: 2px; margin: 28px auto; }
      .card-subtitle { font-size: 44px; font-weight: 400; opacity: 0.85; letter-spacing: 4px; text-transform: uppercase; }

      #main-clip {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        filter: contrast(1.08) saturate(1.12) brightness(0.96);
      }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
      }
      #grain {
        position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: 0.18;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
      }

      #lower-third {
        position: absolute; left: 80px; bottom: 110px;
        display: flex; align-items: center; gap: 22px;
        padding: 22px 32px; border-radius: 16px;
        background: rgba(11, 11, 16, 0.72);
        backdrop-filter: blur(12px);
        box-shadow: 0 14px 60px rgba(0,0,0,0.45);
      }
      #lower-third .pill { width: 8px; height: 56px; border-radius: 4px; }
      #lower-third .text { font-size: 38px; font-weight: 600; letter-spacing: 0.5px; }
      #lower-third .text .sub { font-size: 22px; font-weight: 400; opacity: 0.7; margin-top: 4px; }

      #flash-transition { position: absolute; inset: 0; background: #fff; pointer-events: none; opacity: 0; }
      #final-fadeout { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: intro card (0-3s) -->
      <div id="intro-card" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="card-bg"></div>
        <div class="card-radial"></div>
        <div class="card-stack">
          <div>
            <div class="card-title" id="intro-title">NEW DROP</div>
            <div class="card-rule" id="intro-rule"></div>
            <div class="card-subtitle" id="intro-subtitle">Coming this week</div>
          </div>
        </div>
      </div>

      <!-- Scene 2: main clip (3-24s) -->
      <video
        id="main-clip"
        class="clip"
        src="assets/clip.mp4"
        data-start="3"
        data-duration="21"
        data-track-index="2"
        data-media-start="0"
        data-volume="0"
        muted
        playsinline
      ></video>
      <div id="vignette" class="clip" data-start="3" data-duration="21" data-track-index="3"></div>
      <div id="grain" class="clip" data-start="3" data-duration="21" data-track-index="4"></div>

      <!-- Lower-third caption (6-14s) -->
      <div id="lower-third" class="clip" data-start="6" data-duration="8" data-track-index="5">
        <div class="pill" id="lower-pill"></div>
        <div class="text">
          <div id="lower-caption">Behind the scenes</div>
          <div class="sub">SPNpeet · spnpeet.studio</div>
        </div>
      </div>

      <!-- Flash transition (24-24.4s) -->
      <div id="flash-transition" class="clip" data-start="24" data-duration="0.4" data-track-index="6"></div>

      <!-- Scene 3: outro card (24-29s) -->
      <div id="outro-card" class="clip" data-start="24" data-duration="5" data-track-index="1">
        <div class="card-bg"></div>
        <div class="card-radial"></div>
        <div class="card-stack">
          <div>
            <div class="card-title" id="outro-title">FOLLOW @SPNpeet</div>
            <div class="card-rule" id="outro-rule"></div>
            <div class="card-subtitle" id="outro-subtitle">More on the way</div>
          </div>
        </div>
      </div>

      <!-- Final fade (29-30s) -->
      <div id="final-fadeout" class="clip" data-start="29" data-duration="1" data-track-index="7"></div>
    </div>

    <script>
      (function () {
        const v = window.__hyperframes.getVariables();
        const accent = v.accent || "#22d3ee";

        const video = document.getElementById("main-clip");
        if (video) {
          video.setAttribute("src", v.clipSrc);
          video.setAttribute("data-media-start", String(v.clipStart));
          video.setAttribute("data-duration", String(v.clipDuration));
        }

        const introTitle = document.getElementById("intro-title");
        const introSubtitle = document.getElementById("intro-subtitle");
        const introRule = document.getElementById("intro-rule");
        if (introTitle) introTitle.textContent = v.introTitle;
        if (introSubtitle) introSubtitle.textContent = v.introSubtitle;
        if (introRule) introRule.style.background = accent;

        const outroTitle = document.getElementById("outro-title");
        const outroSubtitle = document.getElementById("outro-subtitle");
        const outroRule = document.getElementById("outro-rule");
        if (outroTitle) outroTitle.textContent = v.outroTitle;
        if (outroSubtitle) outroSubtitle.textContent = v.outroSubtitle;
        if (outroRule) outroRule.style.background = accent;

        const lowerCaption = document.getElementById("lower-caption");
        const lowerPill = document.getElementById("lower-pill");
        if (lowerCaption) lowerCaption.textContent = v.caption;
        if (lowerPill) lowerPill.style.background = accent;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Intro card
        tl.from(introTitle, { y: 60, opacity: 0, duration: 0.9, ease: "power3.out" }, 0);
        tl.from(introRule, { scaleX: 0, transformOrigin: "50% 50%", duration: 0.7, ease: "power2.out" }, 0.4);
        tl.from(introSubtitle, { y: 30, opacity: 0, duration: 0.7, ease: "power2.out" }, 0.6);
        tl.to("#intro-card", { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.5);
        tl.set("#intro-card", { opacity: 0 }, 3);

        // Main clip eased fade in
        tl.from("#main-clip", { opacity: 0, duration: 0.6, ease: "power2.out" }, 2.9);
        tl.from("#vignette", { opacity: 0, duration: 0.6, ease: "power2.out" }, 2.9);
        tl.from("#grain", { opacity: 0, duration: 0.6, ease: "power2.out" }, 2.9);

        // Lower-third
        tl.from("#lower-third", { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 6);
        tl.to("#lower-third", { x: -60, opacity: 0, duration: 0.5, ease: "power3.in" }, 13.5);
        tl.set("#lower-third", { opacity: 0 }, 14);

        // Whip-pan blur just before the flash
        tl.to("#main-clip", { y: -40, scale: 1.04, duration: 0.35, ease: "power2.in" }, 23.6);

        // Flash transition
        tl.fromTo("#flash-transition", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.in" }, 24);
        tl.to("#flash-transition", { opacity: 0, duration: 0.25, ease: "power2.out" }, 24.15);
        tl.set("#flash-transition", { opacity: 0 }, 24.4);

        // Outro card
        tl.from("#outro-card", { opacity: 0, scale: 0.96, duration: 0.6, ease: "power2.out" }, 24.2);
        tl.from(outroTitle, { y: 40, opacity: 0, duration: 0.7, ease: "power3.out" }, 24.3);
        tl.from(outroRule, { scaleX: 0, transformOrigin: "50% 50%", duration: 0.6, ease: "power2.out" }, 24.6);
        tl.from(outroSubtitle, { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" }, 24.7);

        // Final fade to black
        tl.fromTo("#final-fadeout", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power1.in" }, 29);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
