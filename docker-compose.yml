# ============================================================================
# SPNpeet POS — Local Production-Like Stack
#
#   db   : PostgreSQL 16 (mirrors Supabase Postgres). Migrations in
#          ./supabase/migrations are auto-applied on first boot in order.
#   api  : Golang Transaction Engine (Fiber + pgx). Owns checkout & inventory.
#   web  : Next.js PWA (offline-first POS UI).
#
#   Bring up:   docker compose up --build
#   Tear down:  docker compose down -v   (the -v wipes the db volume)
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: spnpeet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spnpeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-spnpeet_pos}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Migrations are applied alphabetically by the postgres entrypoint on an
      # empty data dir. Mounted read-only so the container can't mutate them.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spnpeet} -d ${POSTGRES_DB:-spnpeet_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spnpeet_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: spnpeet_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8080}
      API_ENV: ${API_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://spnpeet:supersecret_change_me@db:5432/spnpeet_pos?sslmode=disable}
      DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-20}
      DB_POOL_MIN_CONNS: ${DB_POOL_MIN_CONNS:-2}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-your-supabase-jwt-secret}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spnpeet_net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: spnpeet_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    networks:
      - spnpeet_net

volumes:
  db_data:
    driver: local

networks:
  spnpeet_net:
    driver: bridge
